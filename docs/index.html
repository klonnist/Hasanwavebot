<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elliott Wave Bot — Panel</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --panel: #121821;
    --panel-border: #212a37;
    --text: #e6edf3;
    --muted: #8b98a5;
    --green: #3fb950;
    --red: #f85149;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .sub a { color: var(--accent); }
  #status { color: var(--muted); font-size: 12px; margin-bottom: 24px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .tab-btn.active { border-color: var(--accent); color: var(--accent); }

  .profile { display: none; }
  .profile.active { display: block; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 21px; font-weight: 600; margin-top: 6px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }

  section {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  section h2 { font-size: 14px; margin: 0 0 12px; color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--panel-border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .side-buy { color: var(--green); font-weight: 600; }
  .side-sell { color: var(--red); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .badge {
    display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px;
    margin-right: 4px; border: 1px solid var(--panel-border); color: var(--muted);
  }
  .badge.on { color: var(--accent); border-color: var(--accent); }
  .partial-row td { color: var(--muted); font-style: italic; }
  .bt-open {
    background: transparent; border: 1px solid var(--accent); color: var(--accent);
    padding: 3px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;
  }
  .bt-open:hover { background: var(--accent); color: #0b0f14; }
  .bt-hint {
    color: var(--muted); font-size: 12px; margin-bottom: 10px; line-height: 1.5;
  }
  .bt-hint a { color: var(--accent); }
  .bt-config {
    color: var(--muted); font-size: 11.5px; line-height: 1.7;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 2px 16px;
  }
</style>
</head>
<body>

<h1>Elliott Wave Öğrenen Ajan — Sanal Hesap Paneli</h1>
<div class="sub">
  Veriler GitHub Actions tarafından her 15 dakikada bir güncellenir · repo:
  <a href="https://github.com/klonnist/Hasanwavebot" target="_blank">klonnist/Hasanwavebot</a>
  · her profil (3 Elliott Wave zaman dilimi + 1 VWAP ortalamaya dönüş) kendi ayrı sanal 10.000 USDT hesabıyla çalışır
</div>
<div id="status">Yükleniyor…</div>

<div class="tabs" id="tabs"></div>
<div id="profiles"></div>

<script>
const OWNER = "klonnist";
const REPO = "Hasanwavebot";
const BRANCH = "main";
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/data`;

const PROFILES = [
  { key: "15m", dir: "15m", label: "15 Dakika · Scalp", leverage: "10x" },
  { key: "4h",  dir: "4h",  label: "4 Saat · Swing",    leverage: "5x" },
  { key: "1d",  dir: "1d",  label: "1 Gün · Pozisyon",  leverage: "3x" },
  { key: "vwap", dir: "vwap", label: "VWAP · Ortalamaya Dönüş", leverage: "10x" },
];

function fmt(n, digits = 2) {
  if (n === undefined || n === null || isNaN(n)) return "-";
  return Number(n).toLocaleString("tr-TR", { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
function pnlClass(n) { return n >= 0 ? "pos" : "neg"; }
function fmtTime(t) { return (t || "").replace("T", " ").replace("+00:00", " UTC"); }

async function fetchJson(path) {
  const res = await fetch(`${RAW}/${path}?t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function computeStats(account) {
  const history = account.history || [];
  const openPositions = Object.values(account.open_positions || {});
  const startingBalance = account.starting_balance ?? 10000;
  const unrealizedPnl = openPositions.reduce((s, p) => s + (p.unrealized_pnl || 0), 0);
  const fundingTotal = history.reduce((s, t) => s + (t.funding_paid || 0), 0)
    + openPositions.reduce((s, p) => s + (p.funding_paid || 0), 0);
  const base = {
    total_pnl: account.balance - startingBalance,  // gerceklesen net (funding dahil)
    balance: account.balance,
    open_positions: openPositions.length,
    unrealized_pnl: unrealizedPnl,
    funding_total: fundingTotal,
  };
  // PARTIAL_TP kayitlari tamamlanmis bir islem degil (pozisyon hala acik,
  // trailing stop ile devam ediyor) -- islem sayisi/kazanma oranindan haric.
  const completed = history.filter(t => t.result === "TP" || t.result === "SL");
  if (completed.length === 0) {
    return { trades: 0, win_rate: 0, ...base };
  }
  // Kazanma/kayip GERCEK pnl isaretine gore: trailing stop kar durumundayken
  // tetiklenirse (result "SL" olsa bile) bu hala bir kazanctir.
  const wins = completed.filter(t => t.pnl >= 0).length;
  return {
    trades: completed.length,
    win_rate: 100 * wins / completed.length,
    ...base,
  };
}

function computeSideStats(account) {
  const history = account.history || [];
  const completed = history.filter(t => t.result === "TP" || t.result === "SL");
  const sides = { BUY: { n: 0, wins: 0, pnl: 0 }, SELL: { n: 0, wins: 0, pnl: 0 } };
  for (const t of completed) {
    const s = sides[t.side];
    if (!s) continue;
    s.n += 1;
    s.pnl += t.pnl;
    if (t.pnl >= 0) s.wins += 1;
  }
  return sides;
}

function renderSideStats(p, account) {
  const el = document.getElementById(`side-${p.key}`);
  const sides = computeSideStats(account);
  const rows = ["BUY", "SELL"].map(side => {
    const s = sides[side];
    const winRate = s.n ? 100 * s.wins / s.n : 0;
    return `
      <tr>
        <td class="side-${side.toLowerCase()}">${side}</td>
        <td>${s.n}</td>
        <td>${s.n ? `%${fmt(winRate, 1)}` : "-"}</td>
        <td class="${pnlClass(s.pnl)}">${s.n ? `${s.pnl >= 0 ? "+" : ""}${fmt(s.pnl)}` : "-"}</td>
      </tr>
    `;
  }).join("");
  el.innerHTML = `
    <table>
      <thead><tr><th>Yön</th><th>İşlem</th><th>Kazanma Oranı</th><th>Toplam K/Z (USDT)</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function buildProfileSkeleton(p) {
  return `
    <div class="cards" id="cards-${p.key}"></div>
    <section>
      <h2>Yön Bazlı Performans (BUY vs SELL)</h2>
      <div style="color:var(--muted);font-size:11px;margin-bottom:8px;">
        Piyasa genel bir yönde hareket ettiğinde bir taraf (örn. hep SELL) sistematik olarak daha iyi/kötü çalışabilir —
        bu asimetriyi burada takip edebilirsin.
      </div>
      <div class="table-wrap" id="side-${p.key}"></div>
    </section>
    <section>
      <h2>Açık Pozisyonlar</h2>
      <div class="table-wrap" id="open-${p.key}"></div>
    </section>
    <section>
      <h2>Son İşlemler</h2>
      <div style="color:var(--muted);font-size:11px;margin-bottom:8px;">
        "KISMİ AL" satırları pozisyon henüz kapanmadan alınan kısmi kârı gösterir (istatistiklere dahil edilmez) ·
        K/Z yanındaki * işareti, o işlemde kısmi kâr alınıp kalanının trailing stop ile devam ettiğini belirtir
      </div>
      <div class="table-wrap" id="hist-${p.key}"></div>
    </section>
    <section>
      <h2>Öğrenilen En İyi Parametre Kombinasyonları</h2>
      <div class="table-wrap" id="lb-${p.key}"></div>
    </section>
  `;
}

function renderCards(p, stats) {
  const cards = [
    { label: "Bakiye", value: `${fmt(stats.balance)} USDT` },
    { label: "Toplam K/Z", value: `${stats.total_pnl >= 0 ? "+" : ""}${fmt(stats.total_pnl)} USDT`, cls: pnlClass(stats.total_pnl) },
    { label: "Anlık K/Z", value: `${stats.unrealized_pnl >= 0 ? "+" : ""}${fmt(stats.unrealized_pnl)} USDT`, cls: pnlClass(stats.unrealized_pnl) },
    { label: "Funding Maliyeti", value: `${stats.funding_total >= 0 ? "-" : "+"}${fmt(Math.abs(stats.funding_total))} USDT`, cls: stats.funding_total > 0 ? "neg" : "pos" },
    { label: "Kazanma Oranı", value: `%${fmt(stats.win_rate, 1)}` },
    { label: "Toplam İşlem", value: stats.trades },
    { label: "Açık Pozisyon", value: stats.open_positions },
    { label: "Kaldıraç", value: p.leverage },
  ];
  document.getElementById(`cards-${p.key}`).innerHTML = cards.map(c => `
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value ${c.cls || ""}">${c.value}</div>
    </div>
  `).join("");
}

function renderOpenPositions(p, account) {
  const positions = Object.values(account.open_positions || {});
  const el = document.getElementById(`open-${p.key}`);
  if (positions.length === 0) {
    el.innerHTML = `<div class="empty">Şu anda açık pozisyon yok.</div>`;
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>Sembol</th><th>Yön</th><th>Giriş</th><th>Anlık Fiyat</th><th>Anlık K/Z</th><th>Anlık R</th>
        <th>TP</th><th>SL</th><th>Durum</th><th>Kaldıraç</th><th>Margin (USDT)</th><th>Risk (USDT)</th><th>Funding</th><th>Açılış</th>
      </tr></thead>
      <tbody>
        ${positions.map(pos => `
          <tr>
            <td>${pos.symbol}</td>
            <td class="side-${pos.side.toLowerCase()}">${pos.side}</td>
            <td>${fmt(pos.entry, 4)}</td>
            <td>${fmt(pos.last_price, 4)}</td>
            <td class="${pnlClass(pos.unrealized_pnl || 0)}">${(pos.unrealized_pnl || 0) >= 0 ? "+" : ""}${fmt(pos.unrealized_pnl || 0)}</td>
            <td class="${pnlClass(pos.unrealized_r || 0)}">${fmt(pos.unrealized_r || 0, 2)}</td>
            <td>${fmt(pos.tp, 4)}</td>
            <td>${fmt(pos.sl, 4)}</td>
            <td>
              <span class="badge ${pos.breakeven_done ? "on" : ""}">başabaş</span>
              <span class="badge ${pos.partial_tp_done ? "on" : ""}">kısmi+trail</span>
            </td>
            <td>${fmt(pos.leverage, 0)}x</td>
            <td>${fmt(pos.margin)}</td>
            <td>${fmt(pos.risk_amount)}</td>
            <td class="${pnlClass(-(pos.funding_paid || 0))}">${(pos.funding_paid || 0) > 0 ? "-" : "+"}${fmt(Math.abs(pos.funding_paid || 0))}</td>
            <td>${fmtTime(pos.open_time)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

function renderHistory(p, account) {
  const history = [...(account.history || [])].reverse().slice(0, 30);
  const el = document.getElementById(`hist-${p.key}`);
  if (history.length === 0) {
    el.innerHTML = `<div class="empty">Henüz kapanmış işlem yok.</div>`;
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>Sembol</th><th>Yön</th><th>Sonuç</th><th>Giriş</th><th>Çıkış</th><th>Kaldıraç</th><th>K/Z (USDT)</th><th>Funding</th><th>R</th><th>Kapanış</th>
      </tr></thead>
      <tbody>
        ${history.map(t => {
          const isPartial = t.result === "PARTIAL_TP";
          // Kazanma/kayip GERCEK pnl isaretine gore: trailing stop kar durumundayken
          // tetiklenirse (result "SL" olsa bile) bu hala bir kazanctir.
          const profitable = t.pnl >= 0;
          let sonucLabel, sonucCls;
          if (isPartial) { sonucLabel = "KISMİ AL"; sonucCls = ""; }
          else if (t.result === "TP") { sonucLabel = "KAZANÇ"; sonucCls = "pos"; }
          else { sonucLabel = profitable ? "KAZANÇ (trailing)" : "KAYIP"; sonucCls = profitable ? "pos" : "neg"; }
          return `
          <tr class="${isPartial ? "partial-row" : ""}">
            <td>${t.symbol}</td>
            <td class="side-${t.side.toLowerCase()}">${t.side}</td>
            <td class="${sonucCls}">${sonucLabel}</td>
            <td>${fmt(t.entry, 4)}</td>
            <td>${fmt(t.exit, 4)}</td>
            <td>${fmt(t.leverage, 0)}x</td>
            <td class="${pnlClass(t.pnl)}">${t.pnl >= 0 ? "+" : ""}${fmt(t.pnl)}${t.partial_taken ? " *" : ""}</td>
            <td class="${pnlClass(-(t.funding_paid || 0))}">${(t.funding_paid || 0) > 0 ? "-" : "+"}${fmt(Math.abs(t.funding_paid || 0))}</td>
            <td class="${pnlClass(t.r_multiple)}">${fmt(t.r_multiple, 2)}</td>
            <td>${fmtTime(t.close_time)}</td>
          </tr>
        `;
        }).join("")}
      </tbody>
    </table>
  `;
}

function renderLeaderboard(p, learner) {
  const rows = Object.entries(learner || {}).map(([key, s]) => {
    const [dev, tp, sl] = JSON.parse(key);
    return { dev, tp, sl, n: s.n, winRate: s.n ? 100 * s.wins / s.n : 0, avgR: s.n ? s.reward_sum / s.n : 0 };
  }).filter(r => r.n > 0).sort((a, b) => b.avgR - a.avgR);

  const el = document.getElementById(`lb-${p.key}`);
  if (rows.length === 0) {
    el.innerHTML = `<div class="empty">Henüz yeterli veri yok.</div>`;
    return;
  }
  const firstColLabel = p.key === "vwap" ? "Bant×" : "ATR×";
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>${firstColLabel}</th><th>TP Çarpanı</th><th>Deneme</th><th>Kazanma Oranı</th><th>Ort. R</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td>${fmt(r.dev, 1)}</td>
            <td>${fmt(r.tp, 3)}</td>
            <td>${r.n}</td>
            <td>%${fmt(r.winRate, 1)}</td>
            <td class="${pnlClass(r.avgR)}">${fmt(r.avgR, 2)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

// ---------------- backtest sekmesi ----------------
function buildEquitySvg(points, startingBalance) {
  if (!points || points.length < 2) {
    return `<div class="empty">Grafik için yeterli veri yok.</div>`;
  }
  const W = 640, H = 180, padL = 62, padR = 14, padT = 14, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const balances = points.map(p => p.balance);
  let min = Math.min(...balances, startingBalance);
  let max = Math.max(...balances, startingBalance);
  if (max === min) max = min + 1;
  const pad = (max - min) * 0.08;
  min -= pad; max += pad;

  const x = i => padL + (i / (points.length - 1)) * plotW;
  const y = v => padT + plotH - ((v - min) / (max - min)) * plotH;
  const line = points.map((p, i) => `${x(i).toFixed(1)},${y(p.balance).toFixed(1)}`).join(" ");
  const final = balances[balances.length - 1];
  const color = final >= startingBalance ? "var(--green)" : "var(--red)";
  const baseY = y(startingBalance);
  const firstT = (points[0].t || "").slice(0, 10);
  const lastT = (points[points.length - 1].t || "").slice(0, 10);

  // Etiketler ust uste binmesin: baslangic cizgisine 12px'den yakin olan
  // min/max etiketini cizme (baslangic seviyesi daha bilgilendirici).
  const yMaxLabel = padT + 10, yMinLabel = padT + plotH;
  const labels = [
    { y: baseY + 3, text: fmt(startingBalance, 0) },
    ...(Math.abs(yMaxLabel - baseY) > 12 ? [{ y: yMaxLabel, text: fmt(max, 0) }] : []),
    ...(Math.abs(yMinLabel - baseY) > 12 ? [{ y: yMinLabel, text: fmt(min, 0) }] : []),
  ];

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Bakiye eğrisi">
      <line x1="${padL}" y1="${baseY}" x2="${W - padR}" y2="${baseY}"
            stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>
      <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
      ${labels.map(l => `<text x="${padL - 8}" y="${l.y.toFixed(1)}" text-anchor="end" fill="var(--muted)" font-size="10">${l.text}</text>`).join("")}
      <text x="${padL}" y="${H - 7}" fill="var(--muted)" font-size="10">${firstT}</text>
      <text x="${W - padR}" y="${H - 7}" text-anchor="end" fill="var(--muted)" font-size="10">${lastT}</text>
    </svg>
  `;
}

function renderBacktestList(runs) {
  const el = document.getElementById("bt-list");
  if (!runs || runs.length === 0) {
    el.innerHTML = `<div class="empty">Henüz backtest çalıştırılmamış — yukarıdaki bağlantıdan başlatabilirsin.</div>`;
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>Çalıştırma</th><th>Strateji</th><th>Periyot</th><th>Tarih Aralığı</th><th>Coin</th>
        <th>İşlem</th><th>Kazanma</th><th>Toplam K/Z</th><th>Max Drawdown</th><th></th>
      </tr></thead>
      <tbody>
        ${runs.map(r => `
          <tr>
            <td>${fmtTime(r.created_at)}</td>
            <td>${r.strategy}</td>
            <td>${r.timeframe}</td>
            <td>${r.date_from} → ${r.date_to}</td>
            <td>${r.symbol_count}</td>
            <td>${r.trades}</td>
            <td>%${fmt(r.win_rate, 1)}</td>
            <td class="${pnlClass(r.total_pnl)}">${r.total_pnl >= 0 ? "+" : ""}${fmt(r.total_pnl)} (${r.total_pnl_pct >= 0 ? "+" : ""}${fmt(r.total_pnl_pct, 1)}%)</td>
            <td class="neg">%${fmt(r.max_drawdown_pct, 1)}</td>
            <td><button class="bt-open" data-file="${r.file}">Detay</button></td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
  el.querySelectorAll(".bt-open").forEach(btn => {
    btn.addEventListener("click", () => openBacktestDetail(btn.dataset.file));
  });
}

function renderBacktestDetail(r) {
  const el = document.getElementById("bt-detail");
  const s = r.summary, c = r.config;
  const firstColLabel = c.strategy === "vwap" ? "Bant×" : "ATR×";

  const cards = [
    { label: "Başlangıç", value: `${fmt(s.starting_balance)} USDT` },
    { label: "Bitiş", value: `${fmt(s.final_balance)} USDT` },
    { label: "Toplam K/Z", value: `${s.total_pnl >= 0 ? "+" : ""}${fmt(s.total_pnl)} USDT`, cls: pnlClass(s.total_pnl) },
    { label: "Getiri", value: `${s.total_pnl_pct >= 0 ? "+" : ""}${fmt(s.total_pnl_pct, 1)}%`, cls: pnlClass(s.total_pnl_pct) },
    { label: "İşlem", value: s.trades },
    { label: "Kazanma Oranı", value: `%${fmt(s.win_rate, 1)}` },
    { label: "Max Drawdown", value: `%${fmt(s.max_drawdown_pct, 1)}`, cls: "neg" },
  ];

  const lbRows = (r.leaderboard || []).map(row => `
    <tr>
      <td>${fmt(row.first, 1)}</td>
      <td>${fmt(row.tp_mult, 3)}</td>
      <td>${row.n}</td>
      <td>%${fmt(row.win_rate, 1)}</td>
      <td class="${pnlClass(row.avg_r)}">${fmt(row.avg_r, 2)}</td>
    </tr>
  `).join("");

  const tradeRows = [...(r.trades || [])].reverse().map(t => {
    const isPartial = t.result === "PARTIAL_TP";
    const profitable = t.pnl >= 0;
    let label, cls;
    if (isPartial) { label = "KISMİ AL"; cls = ""; }
    else if (t.result === "TP") { label = "KAZANÇ"; cls = "pos"; }
    else { label = profitable ? "KAZANÇ (trailing)" : "KAYIP"; cls = profitable ? "pos" : "neg"; }
    return `
      <tr class="${isPartial ? "partial-row" : ""}">
        <td>${t.symbol}</td>
        <td class="side-${(t.side || "").toLowerCase()}">${t.side}</td>
        <td class="${cls}">${label}</td>
        <td>${fmt(t.entry, 4)}</td>
        <td>${fmt(t.exit, 4)}</td>
        <td class="${pnlClass(t.pnl)}">${t.pnl >= 0 ? "+" : ""}${fmt(t.pnl)}</td>
        <td class="${pnlClass(t.r_multiple)}">${fmt(t.r_multiple, 2)}</td>
        <td>${fmtTime(t.close_time)}</td>
      </tr>
    `;
  }).join("");

  el.innerHTML = `
    <div class="cards">
      ${cards.map(x => `
        <div class="card">
          <div class="label">${x.label}</div>
          <div class="value ${x.cls || ""}">${x.value}</div>
        </div>
      `).join("")}
    </div>

    <section>
      <h2>Bakiye Eğrisi — ${c.strategy} · ${c.timeframe} · ${c.date_from} → ${c.date_to}</h2>
      ${buildEquitySvg(r.equity, s.starting_balance)}
    </section>

    <section>
      <h2>Bu Testte Öğrenilen En İyi Parametreler</h2>
      <div class="table-wrap">
        ${lbRows ? `<table>
          <thead><tr><th>${firstColLabel}</th><th>TP Çarpanı</th><th>Deneme</th><th>Kazanma Oranı</th><th>Ort. R</th></tr></thead>
          <tbody>${lbRows}</tbody>
        </table>` : `<div class="empty">Yeterli veri yok.</div>`}
      </div>
    </section>

    <section>
      <h2>İşlemler (son ${(r.trades || []).length})</h2>
      <div class="table-wrap">
        ${tradeRows ? `<table>
          <thead><tr><th>Sembol</th><th>Yön</th><th>Sonuç</th><th>Giriş</th><th>Çıkış</th><th>K/Z (USDT)</th><th>R</th><th>Kapanış</th></tr></thead>
          <tbody>${tradeRows}</tbody>
        </table>` : `<div class="empty">İşlem yok.</div>`}
      </div>
    </section>

    <section>
      <h2>Kullanılan Ayarlar</h2>
      <div class="bt-config">
        <div>Strateji: <b>${c.strategy}</b></div>
        <div>Zaman dilimi: <b>${c.timeframe}</b></div>
        <div>Pencere: <b>${c.window} mum</b></div>
        <div>Kaldıraç: <b>${fmt(c.leverage, 0)}x</b></div>
        <div>İşlem başına teminat: <b>${fmt(c.trade_margin)} USDT</b></div>
        <div>Max eşzamanlı pozisyon: <b>${c.max_open}</b></div>
        <div>Max portföy riski: <b>%${fmt(c.max_portfolio_risk_pct, 1)}</b></div>
        <div>Başabaş / Kısmi: <b>${fmt(c.breakeven_r, 1)}R / ${fmt(c.partial_tp_r, 1)}R</b></div>
        <div>Coin sayısı: <b>${(c.symbols || []).length}</b></div>
      </div>
    </section>
  `;
}

async function openBacktestDetail(file) {
  const el = document.getElementById("bt-detail");
  el.innerHTML = `<div class="empty">Rapor yükleniyor…</div>`;
  try {
    const report = await fetchJson(`backtests/${file}`);
    renderBacktestDetail(report);
  } catch (e) {
    el.innerHTML = `<div class="empty">Rapor yüklenemedi: ${e.message}</div>`;
  }
}

async function loadBacktests() {
  let index;
  try {
    index = await fetchJson("backtests/index.json");
  } catch {
    index = { runs: [] };
  }
  const runs = index.runs || [];
  renderBacktestList(runs);
  if (runs.length > 0 && !document.getElementById("bt-detail").dataset.loaded) {
    document.getElementById("bt-detail").dataset.loaded = "1";
    await openBacktestDetail(runs[0].file);  // en yeni calistirmayi otomatik ac
  }
}

async function loadProfile(p) {
  const [account, learner] = await Promise.all([
    fetchJson(`${p.dir}/account_state.json`).catch(() => ({ balance: 10000, history: [], open_positions: {} })),
    fetchJson(`${p.dir}/learner_state.json`).catch(() => ({})),
  ]);
  renderCards(p, computeStats(account));
  renderSideStats(p, account);
  renderOpenPositions(p, account);
  renderHistory(p, account);
  renderLeaderboard(p, learner);
}

function buildBacktestSkeleton() {
  return `
    <section>
      <h2>Geçmiş Backtest Çalışmaları</h2>
      <div class="bt-hint">
        Yeni bir backtest başlatmak için:
        <a href="https://github.com/${OWNER}/${REPO}/actions/workflows/backtest.yml" target="_blank">Actions → "Backtest calistir" → Run workflow</a>
        — strateji, zaman dilimi ve tarih aralığını girip çalıştır; sonuç birkaç dakika içinde burada listelenir.
      </div>
      <div class="table-wrap" id="bt-list"></div>
    </section>
    <div id="bt-detail"></div>
  `;
}

function initTabs() {
  document.getElementById("tabs").innerHTML = PROFILES.map((p, i) => `
    <button class="tab-btn ${i === 0 ? "active" : ""}" data-key="${p.key}">${p.label}</button>
  `).join("") + `<button class="tab-btn" data-key="backtest">📊 Backtest</button>`;

  document.getElementById("profiles").innerHTML = PROFILES.map((p, i) => `
    <div class="profile ${i === 0 ? "active" : ""}" id="profile-${p.key}">
      ${buildProfileSkeleton(p)}
    </div>
  `).join("") + `<div class="profile" id="profile-backtest">${buildBacktestSkeleton()}</div>`;

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".profile").forEach(s => s.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`profile-${btn.dataset.key}`).classList.add("active");
    });
  });
}

async function loadAll() {
  const status = document.getElementById("status");
  try {
    await Promise.all([...PROFILES.map(loadProfile), loadBacktests()]);
    status.textContent = `Son güncelleme: ${new Date().toLocaleString("tr-TR")}`;
  } catch (e) {
    status.textContent = `Veri yüklenemedi: ${e.message}`;
  }
}

initTabs();
loadAll();
setInterval(loadAll, 60000);
</script>
