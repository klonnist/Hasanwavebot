name: Saglik kontrolu

on:
  schedule:
    # Her 6 saatte bir -- son islemleri gercek piyasa verisiyle dogrular,
    # hesap durumunu ve Actions'in duzenli calisip calismadigini kontrol eder.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run health check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python health_check.py

      - name: Saglik raporunu commit et
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/health/
          if git diff --cached --quiet; then
            echo "Yeni rapor yok, commit atlaniyor."
            exit 0
          fi
          git commit -m "Saglik raporu guncellendi [skip ci]"
          git pull --rebase --autostash origin main
          git push
