name: Run wave bot scan

on:
  schedule:
    # Her 15 dakikada bir 3 zaman dilimini de tek tek tarar
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: run-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan 15m (scalp, 10x kaldirac, islem basina 500 USDT teminat)
        run: python main.py --timeframe 15m --leverage 10 --trade-margin 500 --data-dir ./data/15m --once

      - name: Scan 4h (swing, 5x kaldirac, islem basina 500 USDT teminat)
        run: python main.py --timeframe 4h --leverage 5 --trade-margin 500 --data-dir ./data/4h --once

      - name: Scan 1d (pozisyon, 3x kaldirac, islem basina 500 USDT teminat)
        run: python main.py --timeframe 1d --leverage 3 --trade-margin 500 --data-dir ./data/1d --once

      - name: Scan vwap (15m, VWAP ortalamaya donus, 10x kaldirac, islem basina 500 USDT teminat)
        run: python main.py --strategy vwap --timeframe 15m --leverage 10 --trade-margin 500 --data-dir ./data/vwap --once

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update bot state [skip ci]"
          git push
