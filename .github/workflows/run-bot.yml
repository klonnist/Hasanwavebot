name: Run wave bot scan

on:
  schedule:
    # Her 15 dakikada bir 3 zaman dilimini de tek tek tarar
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: run-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan 15m (scalp, 10x kaldirac, islem basina 500 USDT teminat)
        run: python main.py --timeframe 15m --leverage 10 --trade-margin 500 --data-dir ./data/15m --once

      - name: Scan 4h (swing, 5x kaldirac, islem basina 500 USDT teminat)
        run: python main.py --timeframe 4h --leverage 5 --trade-margin 500 --data-dir ./data/4h --once

      - name: Scan 1d (pozisyon, 3x kaldirac, islem basina 500 USDT teminat)
        run: python main.py --timeframe 1d --leverage 3 --trade-margin 500 --data-dir ./data/1d --once

      - name: Scan vwap (15m, VWAP ortalamaya donus, 10x kaldirac, islem basina 500 USDT teminat)
        run: python main.py --strategy vwap --timeframe 15m --leverage 10 --trade-margin 500 --data-dir ./data/vwap --once

      # R bazli Top50 profilleri: OKX'te 24s hacme gore ilk 50 KRIPTO coin, sabit risk (1R = 100 USDT),
      # havuzlu ogrenme. --leverage 100 yalnizca teminat muhasebesi icin (pozisyon boyutunu stop mesafesi belirler).
      # continue-on-error: bu adimlar cokerse "Commit updated state" atlanip diger profillerin verisi kaybolmasin.
      - name: Scan r50-15m (Top50 kripto, 15m, sabit risk 1R=100 USDT)
        continue-on-error: true
        run: python main.py --timeframe 15m --top-n 50 --universe-file ./data/universe_top50.json --risk-per-trade 100 --leverage 100 --max-open 10 --max-portfolio-risk-pct 11 --max-same-direction 6 --pooled-learning --min-sl-pct 0.4 --max-sl-pct 30 --data-dir ./data/r50-15m --once

      - name: Scan r50-4h (Top50 kripto, 4h, sabit risk 1R=100 USDT)
        continue-on-error: true
        run: python main.py --timeframe 4h --top-n 50 --universe-file ./data/universe_top50.json --risk-per-trade 100 --leverage 100 --max-open 10 --max-portfolio-risk-pct 11 --max-same-direction 6 --pooled-learning --min-sl-pct 0.5 --max-sl-pct 30 --data-dir ./data/r50-4h --once

      # Top100 karsilastirma profilleri: Top50 ile ayni kurallar/limitler, yalniz evren 100 coin (ayri onbellek dosyasi).
      - name: Scan r100-15m (Top100 kripto, 15m, sabit risk 1R=100 USDT)
        continue-on-error: true
        run: python main.py --timeframe 15m --top-n 100 --universe-file ./data/universe_top100.json --risk-per-trade 100 --leverage 100 --max-open 10 --max-portfolio-risk-pct 11 --max-same-direction 6 --pooled-learning --min-sl-pct 0.4 --max-sl-pct 30 --data-dir ./data/r100-15m --once

      - name: Scan r100-4h (Top100 kripto, 4h, sabit risk 1R=100 USDT)
        continue-on-error: true
        run: python main.py --timeframe 4h --top-n 100 --universe-file ./data/universe_top100.json --risk-per-trade 100 --leverage 100 --max-open 10 --max-portfolio-risk-pct 11 --max-same-direction 6 --pooled-learning --min-sl-pct 0.5 --max-sl-pct 30 --data-dir ./data/r100-4h --once

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update bot state [skip ci]"
          git push
